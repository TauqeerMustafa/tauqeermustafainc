name: Build TMI Portals Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Official Release Keystore
        working-directory: ./android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tmi_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tmi_secure_keystore_pass_2026 \
            -keypass tmi_secure_keystore_pass_2026 \
            -dname "CN=Tauqeer Mustafa Inc, OU=Mobile Engineering, O=Tauqeer Mustafa Inc, L=Harrow, ST=London, C=GB"

      - name: Build Signed Release APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/TMI-Portals.apk

      - name: Update Live Web Download APK
        run: |
          cp android/output/TMI-Portals.apk frontend/public/downloads/TMI-Portals.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/downloads/TMI-Portals.apk
          if git diff --staged --quiet; then
            echo "No changes to APK"
          else
            git commit -m "build(apk): deploy v3.0.0.1.7 release APK to web downloads [skip ci]"
            git push origin master
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMI-Portals-Android-APK
          path: android/output/TMI-Portals.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release v3.0.0.1.7
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v3.0.0.1.7
          name: "TMI Portals App v3.0.0.1.7"
          body: |
            ### Official Signed Release APK for Tauqeer Mustafa Inc Portals (v3.0.0.1.7)
            
            **What's New in v3.0.0.1.7:**
            - 💼 **Full Work Profile Provisioning Pipeline**: Added `internalOnly` install location, `device_admin` & `managed_users` features, and `FinalizeActivity` (`ACTION_PROVISIONING_SUCCESSFUL`).
            - 🛡️ **Android 13/14 Restricted Settings Guide**: Direct 1-tap navigation to App Info so users can allow restricted settings for sideloaded device policy controllers.
            - ⚡ **Zero Third-Party MDM Required**: Fully self-owned Profile Owner container badged with native Android briefcase 💼.
            
            **Installation:**
            1. Download `TMI-Portals.apk` below.
            2. Tap the file on your Android device and select **Install / Update**.
            3. Contact `admin@tauqeermustafa.tech` for support.
          files: android/output/TMI-Portals.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
