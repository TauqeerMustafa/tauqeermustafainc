name: Cloud Outreach Automation Engine

on:
  schedule:
    - cron: '*/30 * * * *'  # Automatically runs every 30 mins in GitHub Cloud
  workflow_dispatch:        # Manual 1-click trigger in GitHub Actions

permissions:
  contents: write

jobs:
  dispatch-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install openpyxl

      - name: Run Cloud Outreach Dispatcher
        env:
          BATCH_LIMIT: 50
        run: |
          python scripts/cloud_dispatcher.py

      - name: Commit and Push Workbook Progress
        run: |
          git config --global user.name "Qorlune Cloud Automation"
          git config --global user.email "automation@qorlune.co.uk"
          git add data/outreach/Qorlune_1000_New_Worldwide_Prospects.xlsx
          if git diff --staged --quiet; then
            echo "No workbook changes to commit."
          else
            git commit -m "Auto-dispatch: updated outreach workbook progress [skip ci]"
            git push origin master
          fi
