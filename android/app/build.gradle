plugins {
    id 'com.android.application'
}

android {
    namespace 'tech.tauqeermustafa.app'
    compileSdk 34

    defaultConfig {
        applicationId "tech.tauqeermustafa.app"
        minSdk 24
        targetSdk 34
        versionCode 300013
        versionName "3.0.0.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "tmi_secure_keystore_pass_2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "tmi_key"
                keyPassword System.getenv("KEY_PASSWORD") ?: "tmi_secure_keystore_pass_2026"
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
